name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest
      - name: az bicep build
        run: |
          set -e
          for f in infra/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
          done
